# Angular SPA: unknown paths fall back to index.html (client-side routes like /about, /contact).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # index.html must revalidate so a deploy is picked up; the build output is content-hashed (outputHashing: all).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
}
